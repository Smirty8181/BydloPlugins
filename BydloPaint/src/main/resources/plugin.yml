name: BydloPaint
version: 1.0.0
main: ru.bydloland.paint.BydloPaintPlugin
api-version: "1.21"
authors: [Smirty_228]
description: Создание и рисование на картах-холстах размером до 10 на 10 блоков
commands:
  canvas:
    description: Canvas help / admin give
    usage: /canvas | /полотно
    aliases:
      - "\u043f\u043e\u043b\u043e\u0442\u043d\u043e"
      - paintcanvas
permissions:
  bydlopaint.use:
    description: Craft and paint canvases
    default: true
  bydlopaint.admin:
    description: Admin canvas commands
    default: op
