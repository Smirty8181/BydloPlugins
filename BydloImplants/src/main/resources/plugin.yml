name: BydloImplants
version: 1.1.0
main: ru.bydloland.implants.BydloImplantsPlugin
api-version: "1.21"
authors: [Smirty_228]
softdepend: [BydloClasses, CraftEngine]
description: Кибернетические импланты с вариантами и уровнями улучшения
commands:
  implants:
    description: Open implants menu
    usage: /implants | /импланты
    aliases:
      - "\u0438\u043c\u043f\u043b\u0430\u043d\u0442\u044b"
      - implant
      - cyber
permissions:
  bydloimplants.use:
    description: Use implants menu
    default: true
  bydloimplants.admin:
    description: Admin implants
    default: op
